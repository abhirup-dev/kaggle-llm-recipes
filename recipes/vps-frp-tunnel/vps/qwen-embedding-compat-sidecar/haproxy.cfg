global
    log stdout format raw local0
    maxconn 64

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 1h
    timeout server 1h

frontend openai_compat
    bind :8080
    http-request set-header x-portkey-config "{\"strategy\":{\"mode\":\"loadbalance\"},\"targets\":[{\"provider\":\"openai\",\"api_key\":\"no-key\",\"custom_host\":\"http://172.30.0.1:19103/v1\",\"weight\":1}]}"
    default_backend portkey

backend portkey
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host kaggle-portkey-gateway
    server portkey kaggle-portkey-gateway:8787 check
