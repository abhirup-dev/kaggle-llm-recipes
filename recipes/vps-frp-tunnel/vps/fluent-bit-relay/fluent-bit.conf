[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    storage.path              /buffers
    storage.sync              normal
    storage.checksum          on
    storage.max_chunks_up     16

[INPUT]
    Name                      forward
    Listen                    0.0.0.0
    Port                      24224
    Buffer_Chunk_Size         1M
    Buffer_Max_Size           8M
    Shared_Key                ${LOG_RELAY_SHARED_KEY}
    Self_Hostname             kaggle-log-relay
    tls                       on
    tls.verify                off
    tls.crt_file              /certs/server.crt
    tls.key_file              /certs/server.key
    storage.type              filesystem

[OUTPUT]
    Name                      stdout
    Match                     *
    Format                    json_lines

[OUTPUT]
    Name                      file
    Match                     *
    Path                      /logs
    File                      kaggle-workers.jsonl
    Format                    plain
    Mkdir                     true
